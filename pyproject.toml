[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reve-arbitrade-crypto"
version = "0.2.0"
description = "Modular crypto arbitrage platform — Phase 2 functional system"
requires-python = ">=3.10"
dependencies = [
    "ccxt>=4.0",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.22",
    "httpx>=0.24",
    "python-dotenv>=1.0",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-asyncio>=0.21",
    "httpx>=0.24",
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"
asyncio_mode = "auto"
